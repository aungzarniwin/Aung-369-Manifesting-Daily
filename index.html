<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aung's 369 Manifesting</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f0ff;
  color: #222;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

textarea {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.save {
  background: #7b3ff2;
  color: white;
}

.practice {
  background: #222;
  color: white;
}

.progress-box {
  background: #f1ebff;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 15px;
}

.progress-number {
  font-size: 38px;
  font-weight: bold;
}

.progress-bar {
  width: 100%;
  height: 15px;
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 12px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #7b3ff2;
  transition: 0.3s;
}

.counter {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.box {
  flex: 1;
  text-align: center;
  padding: 18px 5px;
  background: #f1ebff;
  border-radius: 12px;
  font-size: 20px;
  font-weight: bold;
}

.small {
  display: block;
  font-size: 13px;
  margin-top: 5px;
  color: #666;
}

.streak {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

<h1>✨ Aung's 369 Manifesting</h1>

<div class="subtitle">
369 Method • Daily Manifestation
</div>


<div class="card">

<h2>🌟 My Intention</h2>

<label>My Goal</label>

<textarea
id="goal"
rows="3"
placeholder="Write your goal...">
</textarea>


<label>My Affirmation</label>

<textarea
id="affirmation"
rows="3"
placeholder="Write your affirmation...">
</textarea>


<button class="save" onclick="saveGoal()">
💾 Save My Goal
</button>

</div>


<div class="card">

<h2>📊 Today's Progress</h2>

<div class="progress-box">

<div class="progress-number" id="progress">
0%
</div>

<div class="progress-bar">

<div
class="progress-fill"
id="progressFill">
</div>

</div>

</div>


<div class="counter">

<div class="box">

<span id="morning">0</span>

<span class="small">
Morning / 3
</span>

</div>


<div class="box">

<span id="afternoon">0</span>

<span class="small">
Afternoon / 6
</span>

</div>


<div class="box">

<span id="night">0</span>

<span class="small">
Night / 9
</span>

</div>

</div>


<button
class="practice"
onclick="completeMorning()">

☀️ Complete Morning 3

</button>


<button
class="practice"
onclick="completeAfternoon()">

🌤️ Complete Afternoon 6

</button>


<button
class="practice"
onclick="completeNight()">

🌙 Complete Night 9

</button>


<div
class="message"
id="message">
Start your 369 practice today ✨
</div>

</div>


<div class="card">

<div class="streak">

🔥 Streak: <span id="streak">0</span> Days

</div>

</div>

</div>


<script>

function saveGoal() {

const goal =
document.getElementById("goal").value;

const affirmation =
document.getElementById("affirmation").value;

localStorage.setItem("goal", goal);

localStorage.setItem(
"affirmation",
affirmation
);

document.getElementById("message").innerHTML =
"✅ Goal and affirmation saved!";

}


function updateProgress() {

const morning =
Number(localStorage.getItem("morning") || 0);

const afternoon =
Number(localStorage.getItem("afternoon") || 0);

const night =
Number(localStorage.getItem("night") || 0);

let progress = 0;

if (morning === 3) {
progress += 33.33;
}

if (afternoon === 6) {
progress += 33.33;
}

if (night === 9) {
progress += 33.34;
}

document.getElementById("progress").innerText =
Math.round(progress) + "%";

document.getElementById("progressFill").style.width =
progress + "%";

}


function completeMorning() {

localStorage.setItem("morning", "3");

document.getElementById("morning").innerText = "3";

updateProgress();

}


function completeAfternoon() {

localStorage.setItem("afternoon", "6");

document.getElementById("afternoon").innerText = "6";

updateProgress();

}


function completeNight() {

localStorage.setItem("night", "9");

document.getElementById("night").innerText = "9";

updateProgress();

document.getElementById("message").innerHTML =
"🎉 369 Complete! Amazing work today!";

let streak =
Number(localStorage.getItem("streak") || 0);

streak++;

localStorage.setItem("streak", streak);

document.getElementById("streak").innerText =
streak;

}


window.onload = function() {

document.getElementById("goal").value =
localStorage.getItem("goal") || "";

document.getElementById("affirmation").value =
localStorage.getItem("affirmation") || "";

document.getElementById("morning").innerText =
localStorage.getItem("morning") || "0";

document.getElementById("afternoon").innerText =
localStorage.getItem("afternoon") || "0";

document.getElementById("night").innerText =
localStorage.getItem("night") || "0";

document.getElementById("streak").innerText =
localStorage.getItem("streak") || "0";

updateProgress();

};

</script>

</body>
</html>
